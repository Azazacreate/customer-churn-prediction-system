[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction-system"
version = "1.0.0"
description = "Intelligent customer churn prediction system (Classical ML & A/B testing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data Science Team" }]
keywords = ["churn", "ml", "xgboost", "lightgbm", "catboost", "ab-testing", "mlflow", "airflow"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
tracking = ["mlflow>=2.9"]
serving = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
collect = ["requests>=2.31", "beautifulsoup4>=4.12", "scrapy>=2.11", "lxml>=4.9"]
db = ["psycopg2-binary>=2.9", "clickhouse-driver>=0.2.6", "SQLAlchemy>=2.0"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=7.4"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
