project:
  name: customer-churn-prediction-system
  seed: 42
paths:
  raw_data: data/raw/churn_raw.parquet
  processed_data: data/processed/churn_features.parquet
  train_data: data/processed/train.parquet
  test_data: data/processed/test.parquet
  model_dir: artifacts/models
  report_dir: reports
sources:
  api:
    base_url: https://api.internal.example.com/v1
    timeout: 30
    endpoints:
      customers: /customers
      subscriptions: /subscriptions
      tickets: /support/tickets
  scraping:
    enabled: false
    target_url: https://example.com/plans
    user_agent: "churn-research-bot/1.0"
  databases:
    postgres:
      dsn: postgresql://user:password@localhost:5432/churn
      enabled: false
    clickhouse:
      host: localhost
      port: 9000
      database: analytics
      enabled: false
synthetic:
  n_samples: 20000
  churn_rate: 0.14          # базовая доля оттока
  start_date: 2022-01-01
  end_date: 2024-12-31
features:
  numeric_impute: median     # median | mean
  categorical_impute: mode
  drop_columns:
    - customer_id
    - signup_date
  engineered:
    - avg_charge_per_gb
    - tickets_per_month
    - charge_to_tenure_ratio
    - is_new_customer
    - engagement_score
  selection:
    enabled: true
    method: importance        # importance | l1 | rfe
    top_k: 30
training:
  test_size: 0.2
  cv_folds: 5
  scoring: roc_auc            # roc_auc | average_precision
  class_weight: balanced
  decision_threshold: 0.5
  search:
    enabled: true
    n_iter: 12
    params:
      xgboost:
        n_estimators: [200, 600]
        max_depth: [3, 8]
        learning_rate: [0.01, 0.2]
        subsample: [0.7, 1.0]
        colsample_bytree: [0.6, 1.0]
      lightgbm:
        n_estimators: [200, 600]
        num_leaves: [15, 63]
        learning_rate: [0.01, 0.2]
        feature_fraction: [0.6, 1.0]
      catboost:
        iterations: [200, 500]
        depth: [3, 8]
        learning_rate: [0.01, 0.2]
  models: [logistic_regression, random_forest, xgboost, lightgbm, catboost]
mlflow:
  enabled: true
  tracking_uri: file:./mlruns
  experiment_name: churn-prediction
ab_testing:
  alpha: 0.05
  power: 0.80
  two_sided: true
